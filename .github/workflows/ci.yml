# =============================================================================
# ci.yml — ThreatAttest Chain Continuous Integration
# =============================================================================
#
# Triggers:
#   - Push to main / develop
#   - Pull requests targeting main
#   - Manual workflow_dispatch
#
# Jobs:
#   lint          — golangci-lint + go vet
#   test          — go test ./... with race detector
#   build         — compile binary (verify it links)
#   test-shell    — offline shell test scripts (no node required)
#   test-js       — Node.js extension badge tests
#   validate-ext  — extension manifest + source validation
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, "release/*"]
    paths-ignore:
      - "**.md"
      - "demo/**"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "demo/**"
  workflow_dispatch:

# Cancel in-progress runs on the same branch for PRs
concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION:   "1.23"
  NODE_VERSION: "20"
  BINARY:       "threatattestd"

jobs:
  # ─── Go lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: chain/go.sum

      - name: go vet
        working-directory: chain
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version:          v1.59.1
          working-directory: chain
          args:             --timeout 5m

  # ─── Go tests ─────────────────────────────────────────────────────────────
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Add more OS when cross-platform tests are needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: chain/go.sum

      - name: Download modules
        working-directory: chain
        run: go mod download

      - name: Verify modules
        working-directory: chain
        run: go mod verify

      - name: Run tests
        working-directory: chain
        run: |
          go test \
            -mod=readonly \
            -timeout 120s \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: chain/coverage.out
          retention-days: 7

  # ─── Build binary ─────────────────────────────────────────────────────────
  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: chain/go.sum

      - name: Build
        working-directory: chain
        run: |
          make build
          ls -lh bin/

      - name: Version check
        working-directory: chain
        run: |
          ./bin/threatattestd version 2>&1 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: threatattestd-linux-amd64
          path: chain/bin/threatattestd
          retention-days: 3

  # ─── Shell integration tests ──────────────────────────────────────────────
  test-shell:
    name: Test (shell scripts)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: chain/go.sum

      - name: Run identity module tests
        working-directory: chain
        run: bash tests/test_identity_module.sh

      - name: Run attester domain tests
        working-directory: chain
        run: bash tests/test_attester_domain.sh

      - name: Run compliance tier tests
        working-directory: chain
        run: bash tests/test_compliance_tiers.sh

  # ─── Node.js extension tests ──────────────────────────────────────────────
  test-js:
    name: Test (Node.js extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run extension badge tests
        working-directory: chain
        run: node tests/test_extension_badges.js

  # ─── Extension validation ─────────────────────────────────────────────────
  validate-ext:
    name: Validate (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate extension sources
        working-directory: extension
        run: node scripts/validate.js

  # ─── Summary gate ─────────────────────────────────────────────────────────
  # All required jobs must pass. Used as a branch protection required check.
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, test, build, test-shell, test-js, validate-ext]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          results='${{ toJSON(needs) }}'
          failures=$(echo "$results" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          failed = [k for k, v in d.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('FAILED:', ', '.join(failed))
              sys.exit(1)
          print('All jobs passed')
          ")
          echo "$failures"